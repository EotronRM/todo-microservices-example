services:
  consul:
    image: hashicorp/consul:1.15
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=api-gateway
    depends_on:
      - consul

  todo-service:
    build:
      context: .
      dockerfile: todo-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=todo-service
    depends_on:
      - consul

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=user-service
    depends_on:
      - consul

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=notification-service
    depends_on:
      - consul
