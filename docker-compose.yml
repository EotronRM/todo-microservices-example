services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todos
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  consul:
    image: hashicorp/consul:1.15
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=api-gateway
    depends_on:
      - consul

  todo-service:
    build:
      context: .
      dockerfile: todo-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=todo-service
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/todos
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - postgres
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=user-service
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - rabbitmq

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=notification-service
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - rabbitmq

  note-card-service-1:
    build:
      context: .
      dockerfile: note-card-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=note-card-service-1
      - PORT=3004
      - INSTANCE_ID=1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - rabbitmq

  note-card-service-2:
    build:
      context: .
      dockerfile: note-card-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=note-card-service-2
      - PORT=3005
      - INSTANCE_ID=2
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - rabbitmq

  saga-orchestrator:
    build:
      context: .
      dockerfile: saga-orchestrator/Dockerfile
    ports:
      - "3010:3010"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ADDRESS=saga-orchestrator
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - consul
      - rabbitmq
