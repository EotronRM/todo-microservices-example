apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-service
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-service
  template:
    metadata:
      labels:
        app: todo-service
    spec:
      containers:
        - name: todo-service
          image: todo-microservices-example-todo-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DISCOVERY_BACKEND
              value: kubernetes
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/todos
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: todo-service
  namespace: todo-app
spec:
  selector:
    app: todo-service
  ports:
    - port: 80
      targetPort: 3001
