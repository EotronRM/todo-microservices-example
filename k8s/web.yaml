apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: todo-microservices-example-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api/ here. The api-gateway Service listens on port 80,
            # not on the container's 3000 that the image defaults to for compose.
            - name: API_GATEWAY_URL
              value: http://api-gateway
          # nginx has no /health, so probe the page itself
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: todo-app
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
