apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
    spec:
      containers:
        - name: saga-orchestrator
          image: todo-microservices-example-saga-orchestrator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3010
          env:
            - name: DISCOVERY_BACKEND
              value: kubernetes
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  namespace: todo-app
spec:
  selector:
    app: saga-orchestrator
  ports:
    - port: 80
      targetPort: 3010
